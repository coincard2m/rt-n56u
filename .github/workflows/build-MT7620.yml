name: Build Padavan MI-3 (PB-Boot)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            build-essential libtool-bin curl cmake gperf gawk flex bison xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo help2man \
            pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libltdl-dev wget unzip
          sudo apt-get -y install libncurses5-dev || sudo apt-get -y install libncurses-dev

      - name: Setup Toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images/

      - name: Fix All Sources & GCC Compatibility (Auto-Patch)
        run: |
          cd trunk
          
          # 1. Sửa toàn bộ mirror tải Go bị chết link trong trunk/tools
          echo ">>> [1/4] Va link tai Golang..."
          find tools -type f -exec sed -i 's|https://gomirrors.org/dl/go|https://dl.google.com/go|g' {} + 2>/dev/null || true
          find tools -type f -exec sed -i 's|https://mirrors.aliyun.com/golang|https://dl.google.com/go|g' {} + 2>/dev/null || true
          
          # 2. Ép cờ -fcommon vào Kernel build để tương thích GCC 11/12
          echo ">>> [2/4] Ep co tuong thich Kernel GCC..."
          find linux-3.4.x -name "Makefile*" -exec sed -i 's/^HOSTCFLAGS\s*:=.*/& -fcommon/' {} + 2>/dev/null || true

          # 3. Sử dụng #if 0 ... #endif để vô hiệu hóa hoàn toàn khối parse hdr
          echo ">>> [3/4] Cat bo hoan toan khoi code hdr gay loi bang #if 0..."
          python3 -c '
          import glob, re
          files = glob.glob("linux-3.4.x/drivers/mtd/**/ralink_nand.c", recursive=True)
          for fpath in files:
              with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()
              
              out = []
              skip = False
              for line in lines:
                  # Khi bắt đầu gặp dòng check hdr, bọc #if 0
                  if "if (0 && sizeof(hdr)" in line or "if (ret_len == sizeof(hdr)" in line:
                      out.append("#if 0 /* Vo hieu hoa doan check header bi loi */\n")
                      out.append(line)
                      skip = True
                      continue
                  # Đóng #endif sau khi gán kernel_size kết thúc (trước khi vào tính partition)
                  if skip and "kernel_size =" in line:
                      out.append(line)
                      out.append("#endif\n")
                      skip = False
                      continue
                  out.append(line)
              
              content = "".join(out)
              # Set offset PB-Boot 0x200000
              content = content.replace("0x600000", "0x200000")
              with open(fpath, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Patched with #if 0: {fpath}")
          '

      - name: Compile Firmware & Auto Diagnostic
        env:
          TNAME: "MI-3"
        run: |
          ROOTDIR=$(pwd)
          CONFIG_TOOLCHAIN_DIR="${ROOTDIR}/toolchain-mipsel"
          
          cd trunk
          if [ ! -f "configs/templates/${TNAME}.config" ]; then
            echo "::error::Khong tim thay file configs/templates/${TNAME}.config!"
            exit 1
          fi
          
          cp -f "configs/templates/${TNAME}.config" .config
          sed -i "s|^CONFIG_TOOLCHAIN_DIR=.*|CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}|g" .config
          
          # Tat cac module keo binary ngoai de tranh chet link
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=y/CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_V2RAY=y/CONFIG_FIRMWARE_INCLUDE_V2RAY=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_TROJAN=y/CONFIG_FIRMWARE_INCLUDE_TROJAN=n/' .config
          
          sudo ./clear_tree_simple
          
          echo ">>> Bat dau bien dich Padavan..."
          set -o pipefail
          sudo ./build_firmware_modify "${TNAME}" 0 2>&1 | tee build_process.log || BUILD_FAILED=1
          
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "=========================================================="
            echo "::error::TIEN TRINH BUILD BI LOI! TRUY TIM LOG LOI CHINH XAC:"
            echo "=========================================================="
            grep -E -C 3 -i "error:|undefined reference|recipe for target .* failed" build_process.log | tail -n 40
            exit 1
          fi
          
          sudo mv -f images/*.trx /opt/images/ 2>/dev/null || true

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-MI-3-Firmware
          path: /opt/images/*.trx
          retention-days: 7
