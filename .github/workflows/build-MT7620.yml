name: Build Padavan MI-3 (PB-Boot + Dual Lang EN/VN)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            build-essential libtool-bin curl cmake gperf gawk flex bison xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo help2man \
            pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libltdl-dev wget unzip \
            liblz4-dev liblzo2-dev
          sudo apt-get -y install libncurses5-dev || sudo apt-get -y install libncurses-dev

      - name: Setup Toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images/

      - name: Patch Sources & Languages & OpenSSL
        run: |
          cd trunk
          
          # 1. Patch CSS để logo hiển thị tự co dãn vừa khít khung 150x71, không tràn ảnh
          find user/www -name "main.css" -exec sed -i 's|width: 150px;|width: 150px; background-size: contain; background-repeat: no-repeat; background-position: center;|g' {} +

          # 2. Khắc phục link Golang chết
          find tools -type f -exec sed -i 's|https://gomirrors.org/dl/go|https://dl.google.com/go|g' {} + 2>/dev/null || true
          find tools -type f -exec sed -i 's|https://mirrors.aliyun.com/golang|https://dl.google.com/go|g' {} + 2>/dev/null || true
          
          # 3. Ép cờ -fcommon tương thích GCC 11/12
          find linux-3.4.x -name "Makefile*" -exec sed -i 's/^HOSTCFLAGS\s*:=.*/& -fcommon/' {} + 2>/dev/null || true

          # 4. Triệt tiêu hoàn toàn target install_docs trong Makefile OpenSSL
          find libs/libssl -name "Makefile*" -exec sed -i 's/install:.*install_docs.*/install: install_sw/g' {} + 2>/dev/null || true
          find libs/libssl -name "Makefile*" -exec sed -i 's/install_docs//g' {} + 2>/dev/null || true
          find user -name "Makefile*" -exec sed -i 's/install_docs//g' {} + 2>/dev/null || true

      - name: Compile Firmware
        env:
          TNAME: "MI-3"
        run: |
          ROOTDIR=$(pwd)
          CONFIG_TOOLCHAIN_DIR="${ROOTDIR}/toolchain-mipsel"
          
          cd trunk
          if [ ! -f "configs/templates/${TNAME}.config" ]; then
            echo "::error::Khong tim thay file configs/templates/${TNAME}.config!"
            exit 1
          fi
          
          cp -f "configs/templates/${TNAME}.config" .config
          sed -i "s|^CONFIG_TOOLCHAIN_DIR=.*|CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}|g" .config
          
          # --- 1. CẤU HÌNH NGÔN NGỮ (BẬT EN + KÊNH CN ĐÃ GÁN TIẾNG VIỆT) ---
          sed -i 's/CONFIG_FIRMWARE_ENABLE_LANG_SELECT=n/CONFIG_FIRMWARE_ENABLE_LANG_SELECT=y/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_EN=n/CONFIG_FIRMWARE_INCLUDE_LANG_EN=y/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_CN=n/CONFIG_FIRMWARE_INCLUDE_LANG_CN=y/' .config
          grep -q "CONFIG_FIRMWARE_ENABLE_LANG_SELECT=y" .config || echo "CONFIG_FIRMWARE_ENABLE_LANG_SELECT=y" >> .config
          grep -q "CONFIG_FIRMWARE_INCLUDE_LANG_EN=y" .config || echo "CONFIG_FIRMWARE_INCLUDE_LANG_EN=y" >> .config
          grep -q "CONFIG_FIRMWARE_INCLUDE_LANG_CN=y" .config || echo "CONFIG_FIRMWARE_INCLUDE_LANG_CN=y" >> .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_RU=y/CONFIG_FIRMWARE_INCLUDE_LANG_RU=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_UK=y/CONFIG_FIRMWARE_INCLUDE_LANG_UK=n/' .config
          
          # --- 2. CẤU HÌNH BẬT TẤT CẢ DRIVER USB & Ổ CỨNG (KHÔNG SỢ READ-ONLY) ---
          for opt in ENABLE_USB ENABLE_UFSD ENABLE_FAT ENABLE_EXFAT ENABLE_EXT2 ENABLE_EXT3 ENABLE_EXT4 ENABLE_FUSE ENABLE_SWAP; do
            sed -i "s/CONFIG_FIRMWARE_${opt}=n/CONFIG_FIRMWARE_${opt}=y/" .config
            grep -q "CONFIG_FIRMWARE_${opt}=y" .config || echo "CONFIG_FIRMWARE_${opt}=y" >> .config
          done

          # --- 3. CẤU HÌNH CỐT LÕI: WIREGUARD, OPENVPN, IPSET, OPENSSL, DROPBEAR ---
          for opt in INCLUDE_HTTPS INCLUDE_OPENSSL_EC INCLUDE_OPENSSL_EXE INCLUDE_DROPBEAR INCLUDE_WIREGUARD INCLUDE_OPENVPN INCLUDE_IPSET INCLUDE_IPMARK INCLUDE_SHAPER INCLUDE_CURL INCLUDE_WGET; do
            sed -i "s/CONFIG_FIRMWARE_${opt}=n/CONFIG_FIRMWARE_${opt}=y/" .config
            grep -q "CONFIG_FIRMWARE_${opt}=y" .config || echo "CONFIG_FIRMWARE_${opt}=y" >> .config
          done
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSH=y/CONFIG_FIRMWARE_INCLUDE_OPENSSH=n/' .config

          # --- 4. ÉP TẮT TOÀN BỘ CÁC GÓI BINTRAY 410 GONE & GÓI CHẾT LINK ---
          for opt in HTOP NANO IPERF3 MTR SOCAT LRZSZ VLMCSD SMARTDNSBIN V2RAY TROJAN SHADOWSOCKS SSSERVER ARIA ARIA_WEB_CONTROL TRANSMISSION TRANSMISSION_WEB_CONTROL TUNSAFE SOFTETHERVPN_SERVER SOFTETHERVPN_CLIENT SOFTETHERVPN_CMD; do
            sed -i "s/CONFIG_FIRMWARE_${opt}=y/CONFIG_FIRMWARE_${opt}=n/" .config
            grep -q "CONFIG_FIRMWARE_${opt}=n" .config || echo "CONFIG_FIRMWARE_${opt}=n" >> .config
          done
          
          sudo ./clear_tree_simple
          
          set -o pipefail
          sudo ./build_firmware_modify "${TNAME}" 0 2>&1 | tee build_process.log || BUILD_FAILED=1
          
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "=========================================================="
            echo "::error::TIEN TRINH BUILD BI LOI! LOG CHI TIET:"
            echo "=========================================================="
            grep -E -C 3 -i "error:|undefined reference|recipe for target .* failed" build_process.log | tail -n 40
            exit 1
          fi
          
          sudo mv -f images/*.trx /opt/images/ 2>/dev/null || true

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-MI-3-Firmware-MultiLang
          path: /opt/images/*.trx
          retention-days: 7
