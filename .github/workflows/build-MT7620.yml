name: Build Padavan MI-3 (PB-Boot)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            build-essential libtool-bin curl cmake gperf gawk flex bison xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo help2man \
            pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libltdl-dev wget unzip
          sudo apt-get -y install libncurses5-dev || sudo apt-get -y install libncurses-dev

      - name: Setup Toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images/

      - name: Patch Sources & GCC & OpenSSL Docs
        run: |
          cd trunk
          # 1. Sửa mirror Golang chết link
          find tools -type f -exec sed -i 's|https://gomirrors.org/dl/go|https://dl.google.com/go|g' {} + 2>/dev/null || true
          find tools -type f -exec sed -i 's|https://mirrors.aliyun.com/golang|https://dl.google.com/go|g' {} + 2>/dev/null || true
          
          # 2. Ép cờ -fcommon tương thích GCC 11/12
          find linux-3.4.x -name "Makefile*" -exec sed -i 's/^HOSTCFLAGS\s*:=.*/& -fcommon/' {} + 2>/dev/null || true

          # 3. Triệt tiêu hoàn toàn target install_docs trong Makefile OpenSSL
          find libs/libssl -name "Makefile*" -exec sed -i 's/install:.*install_docs.*/install: install_sw/g' {} + 2>/dev/null || true
          find libs/libssl -name "Makefile*" -exec sed -i 's/install_docs//g' {} + 2>/dev/null || true
          find user -name "Makefile*" -exec sed -i 's/install_docs//g' {} + 2>/dev/null || true

      - name: Compile Firmware
        env:
          TNAME: "MI-3"
        run: |
          ROOTDIR=$(pwd)
          CONFIG_TOOLCHAIN_DIR="${ROOTDIR}/toolchain-mipsel"
          
          cd trunk
          if [ ! -f "configs/templates/${TNAME}.config" ]; then
            echo "::error::Khong tim thay file configs/templates/${TNAME}.config!"
            exit 1
          fi
          
          cp -f "configs/templates/${TNAME}.config" .config
          sed -i "s|^CONFIG_TOOLCHAIN_DIR=.*|CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}|g" .config
          
          # Đảm bảo cấu hình OpenSSL cơ bản để libcurl biên dịch thành công
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_HTTPS=n/CONFIG_FIRMWARE_INCLUDE_HTTPS=y/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSH=y/CONFIG_FIRMWARE_INCLUDE_OPENSSH=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_DROPBEAR=n/CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y/' .config
          
          # Tắt các gói tải qua bintray hoặc link cá nhân đã chết
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_HTOP=y/CONFIG_FIRMWARE_INCLUDE_HTOP=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_NANO=y/CONFIG_FIRMWARE_INCLUDE_NANO=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_IPERF3=y/CONFIG_FIRMWARE_INCLUDE_IPERF3=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_MTR=y/CONFIG_FIRMWARE_INCLUDE_MTR=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SOCAT=y/CONFIG_FIRMWARE_INCLUDE_SOCAT=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_LRZSZ=y/CONFIG_FIRMWARE_INCLUDE_LRZSZ=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_VLMCSD=y/CONFIG_FIRMWARE_INCLUDE_VLMCSD=n/' .config
          
          # Tắt các module proxy/downloader nặng
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=y/CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_V2RAY=y/CONFIG_FIRMWARE_INCLUDE_V2RAY=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_TROJAN=y/CONFIG_FIRMWARE_INCLUDE_TROJAN=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA=y/CONFIG_FIRMWARE_INCLUDE_ARIA=n/' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=y/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=n/' .config
          
          sudo ./clear_tree_simple
          
          set -o pipefail
          sudo ./build_firmware_modify "${TNAME}" 0 2>&1 | tee build_process.log || BUILD_FAILED=1
          
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "=========================================================="
            echo "::error::TIEN TRINH BUILD BI LOI! LOG CHI TIET:"
            echo "=========================================================="
            grep -E -C 3 -i "error:|undefined reference|recipe for target .* failed" build_process.log | tail -n 40
            exit 1
          fi
          
          sudo mv -f images/*.trx /opt/images/ 2>/dev/null || true

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-MI-3-Firmware
          path: /opt/images/*.trx
          retention-days: 7
