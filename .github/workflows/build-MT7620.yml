name: Build Padavan (MI-3 with WireGuard Kernel)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware for MI-3
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cài đặt Dependencies (Môi trường Ubuntu)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip libtool-bin ccache curl cmake gperf gawk flex bison nano xxd fakeroot kmod cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin

    - name: Chuẩn bị Toolchain
      run: |
        cd toolchain-mipsel
        sh dl_toolchain.sh

    - name: Tự động cấu hình MI-3 (Bật WireGuard, TProxy, IPSet)
      run: |
        cd trunk
        
        # --- 1. Sửa file Template MI-3.config ---
        TPL_CONFIG="configs/templates/MI-3.config"
        
        # Bật các tính năng mạng thiết yếu
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_WIREGUARD.*/CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y/g' $TPL_CONFIG
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_IPSET.*/CONFIG_FIRMWARE_INCLUDE_IPSET=y/g' $TPL_CONFIG
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_SMARTDNS.*/CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y/g' $TPL_CONFIG
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS.*/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y/g' $TPL_CONFIG
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_TROJAN.*/CONFIG_FIRMWARE_INCLUDE_TROJAN=y/g' $TPL_CONFIG
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_IPTABLES.*/CONFIG_FIRMWARE_INCLUDE_IPTABLES=y/g' $TPL_CONFIG
        
        # Tắt XRAY/V2RAY (Nặng, dễ crash trên RAM 128MB)
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_XRAY.*/CONFIG_FIRMWARE_INCLUDE_XRAY=n/g' $TPL_CONFIG
        sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_V2RAY.*/CONFIG_FIRMWARE_INCLUDE_V2RAY=n/g' $TPL_CONFIG

        # --- 2. Vá file Kernel config.linux-3.4.x ---
        KERNEL_CONFIG="configs/boards/MI-3/config.linux-3.4.x"
        
        # Chuyển các cờ bị tắt (dấu #) thành bật (=y)
        sed -i 's/.*CONFIG_NET_IP_TUNNEL.*/CONFIG_NET_IP_TUNNEL=y/g' $KERNEL_CONFIG
        sed -i 's/.*CONFIG_INET_TUNNEL.*/CONFIG_INET_TUNNEL=y/g' $KERNEL_CONFIG
        sed -i 's/.*CONFIG_NETFILTER_TPROXY.*/CONFIG_NETFILTER_TPROXY=y/g' $KERNEL_CONFIG
        sed -i 's/.*CONFIG_NETFILTER_XT_MATCH_TPROXY.*/CONFIG_NETFILTER_XT_MATCH_TPROXY=y/g' $KERNEL_CONFIG
        sed -i 's/.*CONFIG_NETFILTER_XT_TARGET_TPROXY.*/CONFIG_NETFILTER_XT_TARGET_TPROXY=y/g' $KERNEL_CONFIG
        
        # Chống trượt: Nếu cờ hoàn toàn chưa tồn tại, tự động nối thêm vào cuối file
        grep -q "CONFIG_NET_IP_TUNNEL=y" $KERNEL_CONFIG || echo "CONFIG_NET_IP_TUNNEL=y" >> $KERNEL_CONFIG
        grep -q "CONFIG_INET_TUNNEL=y" $KERNEL_CONFIG || echo "CONFIG_INET_TUNNEL=y" >> $KERNEL_CONFIG
        grep -q "CONFIG_NETFILTER_TPROXY=y" $KERNEL_CONFIG || echo "CONFIG_NETFILTER_TPROXY=y" >> $KERNEL_CONFIG
        grep -q "CONFIG_NETFILTER_XT_MATCH_TPROXY=y" $KERNEL_CONFIG || echo "CONFIG_NETFILTER_XT_MATCH_TPROXY=y" >> $KERNEL_CONFIG

    - name: Tiến hành Biên dịch (Build Firmware)
      run: |
        cd trunk
        sudo ./clear_tree
        fakeroot ./build_firmware_modify MI-3

    - name: Trích xuất file ROM (.trx)
      uses: actions/upload-artifact@v4
      with:
        name: MI-3_Padavan_WireGuard_Firmware
        path: trunk/images/*.trx
