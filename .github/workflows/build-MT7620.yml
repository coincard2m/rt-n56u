name: Build Padavan Xiaomi Mi Router 3 (Full VN & Logo)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison nano \
            cpio kmod git subversion libncurses5-dev libssl-dev libxml2-dev gettext texinfo \
            pkg-config libelf-dev autoconf automake libgmp3-dev libmpc-dev libmpfr-dev

      - name: Build Toolchain
        run: |
          cd toolchain-mipsel
          ./clean_sources
          ./build_toolchain

      - name: Patch Logo CSS, Themes & Languages Configuration
        run: |
          cd trunk
          
          # 1. Patch CSS để logo hiển thị chuẩn tỉ lệ, không bị tràn khung
          find user/www -name "main.css" -exec sed -i 's|width: 150px;|width: 150px; background-size: contain; background-repeat: no-repeat; background-position: center;|g' {} +

          # 2. Đồng bộ file ảnh logo sang tất cả các thư mục theme
          LOGO_SRC=$(find user/www -name "asus_logo.png" -o -name "logo.png" | head -n 1)
          if [ -n "$LOGO_SRC" ] && [ -f "$LOGO_SRC" ]; then
            find user/www -name "asus_logo.png" -exec cp -f "$LOGO_SRC" {} +
            find user/www -name "logo.png" -exec cp -f "$LOGO_SRC" {} +
          fi

          # 3. Đảm bảo file EN.header có khai báo nút Tiếng Việt
          if [ -f user/www/dict/EN.header ]; then
            grep -q "LANG_CN" user/www/dict/EN.header && \
              sed -i 's/LANG_CN=.*/LANG_CN=Tiếng Việt/' user/www/dict/EN.header || \
              echo "LANG_CN=Tiếng Việt" >> user/www/dict/EN.header
          fi

          # 4. Cấu hình file template firmware MI-3
          TARGET_CONFIG="configs/templates/MI-3.config"
          if [ ! -f "$TARGET_CONFIG" ]; then
            TARGET_CONFIG=$(find configs/templates/ -name "*MI-3*" -o -name "*MI3*" | head -n 1)
          fi

          if [ -f "$TARGET_CONFIG" ]; then
            # Hỗ trợ định dạng ổ cứng USB
            echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> $TARGET_CONFIG
            echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> $TARGET_CONFIG
            echo "CONFIG_FIRMWARE_ENABLE_EXFAT=y" >> $TARGET_CONFIG
            
            # Tắt tiếng Nga và các ngôn ngữ không cần thiết
            sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_RU=y/CONFIG_FIRMWARE_INCLUDE_LANG_RU=n/' $TARGET_CONFIG
            sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_UK=y/CONFIG_FIRMWARE_INCLUDE_LANG_UK=n/' $TARGET_CONFIG
            
            # Xóa cấu hình cũ để tránh trùng lặp
            sed -i '/CONFIG_FIRMWARE_INCLUDE_LANG_EN/d' $TARGET_CONFIG
            sed -i '/CONFIG_FIRMWARE_INCLUDE_LANG_CN/d' $TARGET_CONFIG
            sed -i '/CONFIG_FIRMWARE_INCLUDE_LANG_SELECT/d' $TARGET_CONFIG
            
            # Bật song ngữ: EN (English) + CN (Tiếng Việt) và bật menu chọn ngôn ngữ
            echo "CONFIG_FIRMWARE_INCLUDE_LANG_EN=y" >> $TARGET_CONFIG
            echo "CONFIG_FIRMWARE_INCLUDE_LANG_CN=y" >> $TARGET_CONFIG
            echo "CONFIG_FIRMWARE_INCLUDE_LANG_SELECT=y" >> $TARGET_CONFIG
          fi

      - name: Build Firmware
        run: |
          cd trunk
          ./clear_tree
          ./build_firmware

      - name: Prepare Artifact Output
        run: |
          mkdir -p output
          find trunk/images -type f -name "*.trx" -exec cp -f {} output/ \;

      - name: Upload Firmware (.trx)
        uses: actions/upload-artifact@v3
        with:
          name: Padavan_Xiaomi_Mi3_Custom_Full_VN
          path: output/*.trx
